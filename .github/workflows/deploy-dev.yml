name: Deploy to dev

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # scripts/build-push-frontend.sh expects tapipy at this exact path.
      - name: Set up tapipy venv
        run: python3 -m venv ~/.venvs/tapis && ~/.venvs/tapis/bin/pip install --upgrade pip tapipy

      # Reuses the existing local deploy script so CI and local deploys stay
      # in sync. Already scoped to dev only (IMAGE=plalelab/patra-dev:latest,
      # TARGET_PODS=patra-dev are its defaults) -- do not point this at
      # build-push-backend.sh's pattern of a hardcoded prod-inclusive pod list.
      #
      # The pod's image field was one-time raw-PUT to plalelab/patra-dev:latest
      # on 2026-08-26 (tapipy's update_pod(image=...) silently no-ops, so this
      # required a raw HTTP PUT) -- this script's build+push+restart is
      # sufficient going forward without further intervention.
      - name: Build, push, and restart patradev
        env:
          TAPIS_PODS_BASE_URL: ${{ secrets.TAPIS_PODS_BASE_URL }}
          TAPIS_USERNAME: ${{ secrets.TAPIS_USERNAME }}
          TAPIS_PASSWORD: ${{ secrets.TAPIS_PASSWORD }}
        run: bash scripts/build-push-frontend.sh
